[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-gearlab"
version = "0.1.0"
description = "Local STEP-first parametric gear generation API for AegisUi."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "cadquery>=2.5,<3"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_gearlab*"]

[tool.pytest.ini_options]
testpaths = ["aegis_gearlab/tests"]
addopts = "-q"

