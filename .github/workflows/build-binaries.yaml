name: Build packaged binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging-preflight:
    name: Manual packaging preflight
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run release health check
        run: node scripts/release-health-check.js

      - name: Packaging note
        run: |
          echo "Official macOS DMG builds are generated locally for now."
          echo "Apple Silicon packaging, ad-hoc signing, Music.app Automation identity"
          echo "and optional notarization depend on a controlled local macOS environment."
          echo "This workflow is manual so normal pushes do not create false red checks."
