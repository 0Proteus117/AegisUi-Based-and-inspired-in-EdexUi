name: Repo health

on:
  push:
    branches:
      - feature/systems-online-pass
  pull_request:
    branches:
      - feature/systems-online-pass
  workflow_dispatch:

concurrency:
  group: repo-health-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint if present
        run: npm run lint --if-present

      - name: Run safe release health check
        run: node scripts/release-health-check.js

      - name: Legacy test note
        run: |
          echo "Repo health intentionally avoids DMG packaging, signing, notarization"
          echo "and legacy Snyk/prebuild flows. Those are validated locally on macOS."
